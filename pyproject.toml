[tool.agentic-os.repo-pointer-skills]
org = "coilyco"

[tool.agentic-os.documentation-layout]
band = "small"
# Placement only. excludes stopped reaching the size caps in agentic-os#1108.
excludes = [
  "mods/",
  "unity/",
  "unity-embedded/",
]
# Size only, and the reason belongs here. unity/Assets/EcoModKit/ is the Eco
# SDK as upstream ships it, so cutting its docs forks them. Each mod under
# mods/Mods/UserCode/ carries the README that renders as its mod.io store page,
# so cutting one changes what a player reads. Neither shape is ours to choose.
vendored = [
  "unity/Assets/EcoModKit/",
  "mods/Mods/UserCode/",
]

[tool.agentic-os.context-load-points]
# mods/ and unity/ still carry the AGENTS.md and CLAUDE.md load-points of the
# repos merged into this one. Excluding them keeps those subtree docs in place
# until the collapse is decided. The unity/ pair is tracked for rewrite in #29.
excludes = [
  "mods/",
  "unity/",
]

# The managed markers are stamped inside the pre-commit YAML and
# cannot form a single top-of-file comment block.
[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml"]
