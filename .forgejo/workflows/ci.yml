name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Root hygiene
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-root-hygiene.sh

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci-telegram-alert.py
  mods:
    name: mods code path
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-egress-proxy.sh
      - name: Python syntax
        run: just python-syntax
      - name: Workflow syntax
        run: just validate-ci
      - name: Package tooling tests
        run: just test-mod-packages
      - name: Package tooling lint
        run: just lint-mod-packages
      - name: Restore and build all mods
        run: just build-mods

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci-telegram-alert.py
  publish-mod:
    name: publish-${{ matrix.package }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: [hygiene, mods, secrets]
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod: BunWulfAgricultural
            package: bunwulf-agricultural
          - mod: BunWulfBiochemical
            package: bunwulf-biochemical
          - mod: BunWulfEducational
            package: bunwulf-educational
          - mod: BunWulfHardwareCo
            package: bunwulf-hardware-co
          - mod: DirectCarbonCapture
            package: direct-carbon-capture
          - mod: EcoNil
            package: eco-nil
          - mod: MinesQuarries
            package: mines-quarries
          - mod: ShopBoat
            package: shop-boat
          - mod: WorldCounter
            package: world-counter
    steps:
      - uses: actions/checkout@v4
      - name: Materialize ${{ matrix.mod }} release assets
        env:
          MOD_NAME: ${{ matrix.mod }}
        run: bash scripts/ci-lfs-pull-mod.sh
      - name: Package ${{ matrix.mod }}
        env:
          MOD_NAME: ${{ matrix.mod }}
          MOD_PACKAGE_NAME: ${{ matrix.package }}
          MOD_SOURCE_REVISION: ${{ github.sha }}
        run: bash scripts/ci-package-mod.sh
      - name: Require the Forgejo package publisher
        env:
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.ECO_MOD_PACKAGE_TOKEN }}
        run: bash scripts/ci-require-package-token.sh
      - name: Publish ${{ matrix.package }}
        env:
          FORGEJO_PACKAGE_URL: ${{ github.server_url }}
          FORGEJO_PACKAGE_OWNER: coilyco-gaming
          FORGEJO_PACKAGE_USER: coilyco-ops
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.ECO_MOD_PACKAGE_TOKEN }}
          MOD_PACKAGE_DIR: .build/mod-package
        run: just publish-mod
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci-telegram-alert.py
  secrets:
    name: Repo secret scan
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/ci-trufflehog.sh
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci-telegram-alert.py
